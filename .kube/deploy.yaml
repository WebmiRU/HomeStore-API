apiVersion: v1
kind: Namespace
metadata:
  name: home-store
---
apiVersion: v1
kind: Secret
metadata:
  name: home-store-secrets
  namespace: home-store
type: Opaque
stringData:
  DB_USERNAME: home_store
  DB_PASSWORD: home_store
  APP_KEY: base64:cWvsj/dGDTT+pVsOF6QQ7snf4O766yJsRi4KFkzTtHg=
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-store-config
  namespace: home-store
data:
  APP_NAME: "Laravel"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://store.dev11.ru"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "warning"
  SESSION_DRIVER: "database"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  FILESYSTEM_DISK: "local"
  NUXT_PUBLIC_API_BASE_URL: "http://api-service"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: home-store
data:
  init.sql: |
    CREATE TEXT SEARCH DICTIONARY russian_hunspell (
        TEMPLATE = ispell,
        dictfile = ru_ru,
        afffile = ru_ru,
        stopwords = russian
    );
    CREATE TEXT SEARCH CONFIGURATION russian_hunspell (COPY = russian);
    ALTER TEXT SEARCH CONFIGURATION russian_hunspell
        ALTER MAPPING FOR hword, hword_part, word WITH russian_hunspell, russian_stem;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: home-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: home-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: home_store
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: hunspell-aff
              mountPath: /usr/share/postgresql/16/tsearch_data/ru_ru.affix
            - name: hunspell-dic
              mountPath: /usr/share/postgresql/16/tsearch_data/ru_ru.dict
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/001-init.sql
              subPath: init.sql
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: hunspell-aff
          hostPath:
            path: /data/home-store/tsearch_data/ru_ru.affix
            type: File
        - name: hunspell-dic
          hostPath:
            path: /data/home-store/tsearch_data/ru_ru.dict
            type: File
        - name: postgres-init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: home-store-postgres
  namespace: home-store
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: home-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: migrate
          image: registry.cubicat.ru/home-store/home-store-api:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              until php artisan migrate --force; do
                echo "migrate failed, retrying in 5s..."
                sleep 5
              done
          envFrom:
            - configMapRef:
                name: home-store-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: APP_KEY
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: home-store-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: home_store
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_PASSWORD
      containers:
        - name: api
          image: registry.cubicat.ru/home-store/home-store-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: home-store-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: APP_KEY
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: home-store-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: home_store
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: home-store
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
  namespace: home-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: www
  template:
    metadata:
      labels:
        app: www
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: www
          image: registry.cubicat.ru/home-store/home-store-www:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NUXT_PUBLIC_API_BASE_URL
              value: http://api-service
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: www-service
  namespace: home-store
spec:
  type: NodePort
  selector:
    app: www
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-store-ingress
  namespace: home-store
spec:
  rules:
    - host: store.dev11.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: www-service
                port:
                  number: 80
