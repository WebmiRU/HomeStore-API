apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app
  namespace: home-store
  labels:
    app: api-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-app
  template:
    metadata:
      labels:
        app: api-app
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: migrate
          image: registry.cubicat.ru/home-store/home-store-api:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              until php artisan migrate --force; do
                echo "migrate failed, retrying in 5s..."
                sleep 5
              done
          envFrom:
            - configMapRef:
                name: home-store-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: APP_KEY
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      containers:
        - name: api-app
          image: registry.cubicat.ru/home-store/home-store-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              name: php-fpm
              protocol: TCP
          envFrom:
            - configMapRef:
                name: home-store-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: APP_KEY
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage/app
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-app
  namespace: home-store
spec:
  selector:
    app: api-app
  ports:
    - name: php-fpm
      port: 9000
      targetPort: 9000
      protocol: TCP
  type: ClusterIP