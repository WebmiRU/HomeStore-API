apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-store-ingress
  namespace: home-store
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: store.dev11.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: www-service
                port:
                  number: 80
    - host: api.dev11.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80