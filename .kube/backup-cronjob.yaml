apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: home-store
  labels:
    app: db-backup
spec:
  schedule: "0 2 * * *"
  timeZone: "Europe/Moscow"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: regcred
          initContainers:
            - name: pg-dump
              image: postgres:16
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  DATE=$(date -u +%F)
                  echo "dumping database ${DB_DATABASE} from ${DB_HOST}..."
                  PGPASSWORD="${DB_PASSWORD}" pg_dump \
                    -h "${DB_HOST}" -U "${DB_USERNAME}" -d "${DB_DATABASE}" \
                    -Fc -Z 9 -f "/backup/db-${DATE}.dump"
                  ls -lh "/backup/db-${DATE}.dump"
              envFrom:
                - configMapRef:
                    name: home-store-config
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: home-store-secrets
                      key: DB_PASSWORD
                - name: DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: home-store-secrets
                      key: DB_USERNAME
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: minio/mc:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mc alias set beget "${AWS_ENDPOINT}" "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}" --api S3v4 >/dev/null
                  DATE=$(date -u +%F)
                  SRC="/backup/db-${DATE}.dump"
                  KEY="backups/full/db/daily/db-${DATE}.dump"
                  echo "uploading ${SRC} -> ${AWS_BUCKET}/${KEY}"
                  mc cp "${SRC}" "beget/${AWS_BUCKET}/${KEY}"
                  echo "upload done"

                  # retention: remove backups older than 14 days (based on lastModified)
                  mc rm --recursive --older-than 14d --force "beget/${AWS_BUCKET}/backups/full/db/daily/"
                  echo "backup job finished"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: home-store-secrets
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: home-store-secrets
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: home-store-secrets
                      key: AWS_BUCKET
                - name: AWS_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: home-store-secrets
                      key: AWS_ENDPOINT
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}