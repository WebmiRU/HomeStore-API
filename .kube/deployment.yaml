apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app
  namespace: home-store
  labels:
    app: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: richarvey/nginx-php-fpm:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          env:
            - name: ROOT
              value: /var/www/html/public
            - name: PHP_USE_PHPCONF
              value: "true"
            - name: PHP_ERROR_LOG
              value: /dev/stderr
            - name: PHP_LOG_LEVEL
              value: Warning
            - name: PHP_FPM_PM
              value: dynamic
            - name: PHP_FPM_PM_MAX_CHILDREN
              value: "10"
            - name: PHP_FPM_PM_START_SERVERS
              value: "2"
            - name: PHP_FPM_PM_MIN_SPARE_SERVERS
              value: "2"
            - name: PHP_FPM_PM_MAX_SPARE_SERVERS
              value: "5"
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: "https://store.dev11.ru"
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: home-store-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: home_store
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-store-secrets
                  key: db-password
            - name: REDIS_HOST
              value: home-store-redis
            - name: CACHE_DRIVER
              value: redis
            - name: SESSION_DRIVER
              value: redis
            - name: QUEUE_CONNECTION
              value: redis
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /sanity-check
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /sanity-check
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage/app
      volumes:
        - name: storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: home-store
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
