server {
    listen 80;
    server_name _;
    index index.php index.html;
    error_log /dev/stderr notice;
    access_log /dev/stdout;

    root /var/www/html/public;

    client_max_body_size 25m;
    client_body_buffer_size 16k;
    client_body_timeout 120;

    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Миниатюры: сначала S3, при 404 — генерация через PHP
    location ~ "^/image/(?<thumb_key>[A-Za-z0-9_\-]+)/(?<thumb_hash>[0-9a-f]{64})$" {
        limit_except GET HEAD {
            deny all;
        }

        rewrite ^ /${AWS_BUCKET}/images/thumbnails/$thumb_key/$thumb_hash break;

        proxy_pass ${AWS_ENDPOINT};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_intercept_errors on;
        error_page 404 403 = @thumb_generate;
    }

    location @thumb_generate {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass api-app:9000;
    }

    location ~ /\.(ht|env)$ {
        deny all;
    }
}