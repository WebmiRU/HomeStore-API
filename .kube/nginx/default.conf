server {
    listen 80;
    index index.php index.html;
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;

    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Миниатюры: сначала S3, при 404 — генерация через PHP
    location ~ "^/image/(?<thumb_key>[A-Za-z0-9_\-]+)/(?<thumb_hash>[0-9a-f]{64})$" {
        limit_except GET HEAD {
            deny all;
        }

        rewrite ^ /58e49e17d3c1-homestore-dev/images/thumbnails/$thumb_key/$thumb_hash break;

        proxy_pass https://s3.ru1.storage.beget.cloud;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_intercept_errors on;
        error_page 404 403 = @thumb_generate;
    }

    location @thumb_generate {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }
}
