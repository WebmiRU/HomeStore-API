version: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer/cache
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./.kube/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:19beta2
    environment:
      POSTGRES_DB: home_store
      POSTGRES_USER: home_store
      POSTGRES_PASSWORD: home_store
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./.kube/postgresql/ru_RU.aff:/usr/share/postgresql/19/tsearch_data/ru_ru.affix:ro
      - ./.kube/postgresql/ru_RU.dic:/usr/share/postgresql/19/tsearch_data/ru_ru.dict:ro
    ports:
      - "5432:5432"

  garage:
    image: dxflrs/garage:v1.0.1
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - "3900:3900"
      - "3903:3903"
    restart: unless-stopped

  redis:
    image: redis:alpine

volumes:
  postgres-data:
  garage-meta:
  garage-data:
