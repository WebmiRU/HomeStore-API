services:
  app:
    build:
      context: .
      dockerfile: .kube/php/Dockerfile
    working_dir: /var/www/html
    environment:
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer/cache
    volumes:
      # :z — SELinux relabel, проект лежит в $HOME (user_home_t), без метки
      # контейнер не может прочитать код (EACCES на public/index.php)
      - .:/var/www/html:z
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:z
      - ./.kube/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - app

  postgres:
    image: postgres:19beta3
    environment:
      POSTGRES_DB: home_store
      POSTGRES_USER: home_store
      POSTGRES_PASSWORD: home_store
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./.kube/postgresql/ru_RU.aff:/usr/share/postgresql/19/tsearch_data/ru_ru.affix:ro,z
      - ./.kube/postgresql/ru_RU.dic:/usr/share/postgresql/19/tsearch_data/ru_ru.dict:ro,z
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine

volumes:
  postgres-data:
