stages:
  - build
  - deploy

variables:
  PHP_IMAGE: $CI_REGISTRY_IMAGE
  WEB_IMAGE: $CI_REGISTRY_IMAGE
  WEB_TAG: $TAG-web
  BRANCH_WEB_TAG: $CI_COMMIT_BRANCH-web
  TAG: $CI_COMMIT_SHORT_SHA
  KUBE_NAMESPACE: home-store

# Skip pipeline for non-code changes
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Cache composer dependencies
cache: &composer_cache
  key:
    files:
      - composer.lock
  paths:
    - vendor/
    - .composer/cache/

# Build stage: build and push php-fpm and nginx images
build-php:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker info
  script:
    - echo "Building php image for $CI_COMMIT_BRANCH ($TAG)"
    - docker build
        -t $PHP_IMAGE:$TAG
        -t $PHP_IMAGE:$CI_COMMIT_BRANCH
        -f .kube/php/Dockerfile
        .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $PHP_IMAGE:$TAG
    - if [ "$CI_COMMIT_BRANCH" = "dev" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push $PHP_IMAGE:$CI_COMMIT_BRANCH;
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build-web:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "Building web image for $CI_COMMIT_BRANCH ($TAG)"
    - docker build
        -t $WEB_IMAGE:$WEB_TAG
        -t $WEB_IMAGE:$BRANCH_WEB_TAG
        -f .kube/nginx/Dockerfile
        .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $WEB_IMAGE:$WEB_TAG
    - if [ "$CI_COMMIT_BRANCH" = "dev" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push $WEB_IMAGE:$BRANCH_WEB_TAG;
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Deploy to k3s
deploy:
  stage: deploy
  image: registry.k8s.io/kubectl:v1.31.0
  before_script:
    - mkdir -p /root/.kube
    - echo "$KUBE_CONFIG" > /root/.kube/config
  script:
    - echo "Deploying $PHP_IMAGE:$TAG / $WEB_IMAGE:$WEB_TAG to $KUBE_NAMESPACE"
    - kubectl set image deployment/api-app api-app=$PHP_IMAGE:$TAG -n $KUBE_NAMESPACE
    - kubectl rollout status deployment/api-app -n $KUBE_NAMESPACE --timeout=300s
    - kubectl set image deployment/api-web api-web=$WEB_IMAGE:$WEB_TAG -n $KUBE_NAMESPACE
    - kubectl rollout status deployment/api-web -n $KUBE_NAMESPACE --timeout=300s
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG